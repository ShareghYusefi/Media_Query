<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Query</title>
    <style>
      /* Default Styles (Desktop) */
      body {
        background-color: white;
        color: black;
        font-size: 18px;
      }

      /* 
        Media Queries: used to apply different styles for different screen sizes

        Media Types: all, screen, print(printers), speech(screen readers).
        
        Media features (conditions): max-width, min-width, max-height, min-height, orientation, aspect-ratio, etc.

        Orientation: portrait, landscape

        aspect-ratio: 16/9, 4/3, 1/1, etc.

        Must be dfined at the end of the CSS file to work properly

        Logical Operators: and, not, only, or (,)
        Logical operators can be used to combine multiple media features together.

      */

      /* Laptop View (Screens >= 768px) and (Screens <= 1024px) */
      @media (min-width: 768px) and (max-width: 1024px) {
        body {
          background-color: lightgreen;
        }
      }

      /* Tablet View (Screens <= 768px) */
      @media (max-width: 768px) {
        body {
          background-color: lightcoral;
        }
      }

      /* Mobile View (Screens <= 480px) */
      @media (max-width: 480px) {
        body {
          background-color: lightblue;
          font-size: 12px;
        }
      }

      /* Print Styles */
      /* for print or screen with max-width: 280px */
      @media print, screen and (max-width: 280px) {
        body {
          background-color: red;
          color: white;
        }
      }

      /* oriantation: landscape */
      /* for screen not in orientation: landscape */
      @media not (orientation: landscape) {
        body {
          background-color: lightyellow;
        }
      }
    </style>
  </head>
  <body>
    <h1>Media Query</h1>
    <p>Resize the window to see the effect.</p>
  </body>
</html>
